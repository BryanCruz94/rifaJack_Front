<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Sistema de Sorteo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/style/style.css">
</head>

<body>
  <main class="container pagina-rifa pagina-sorteo">
    <header class="encabezado-rifa text-center">
      <img src="assets/img/Logo-Espets.png" alt="Logo ESPETS" class="logo-rifa">
      <h2>Sistema de Sorteo</h2>
      <p>Impresi&oacute;n de boletos comprados</p>
    </header>

    <hr>

    <div class="d-flex justify-content-between align-items-center mt-3">
      <span id="user-email" class="text-success font-weight-bold ml-2"></span>
      <button id="logout-btn" class="btn btn-sm btn-outline-danger">Cerrar sesi&oacute;n</button>
    </div>

    <hr>

    <section class="formulario-rifa">
      <div class="fondo-imagen">
        <div class="fondo-vidrio">
          <label for="nombre-rifa">Nombre de la Rifa</label>
          <input type="text" class="form-control" id="nombre-rifa" placeholder="Ej: RIFA ESPETS">

          <button class="btn btn-success btn-block mt-3" id="imprimir-boletos-btn">
            Imprimir boletos comprados
          </button>

          <div class="alert mt-3 d-none" id="estado-sorteo"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer mt-2 py-3 bg-dark text-white footer-redondo">
    <div class="container text-center">
      <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-2">
        <img src="assets/img/logo_transparente - copia.png" alt="Logo Benabet" width="28" height="28"
          class="mr-2 mb-2 mb-md-0">
        <a href="https://www.nairbdev.com" target="_blank" class="text-white">
          <span class="mx-2">Powered by: <strong>NairbDev</strong></span>
        </a>

        <span class="mx-2 text-muted">|</span>
        <span><i class="mr-1"></i> Dev by: <strong>Bryan Cruz</strong> V.2.1.2</span>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script type="module" src="assets/js/sistemaSorteo.js"></script>
</body>

</html>
