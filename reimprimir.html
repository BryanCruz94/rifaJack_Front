<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Reimprimir boleto | ESPETS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/style/style.css">
</head>

<body>
  <main class="container pagina-rifa">
    <header class="encabezado-rifa text-center">
      <img src="assets/img/Logo-Espets.png" alt="Logo ESPETS" class="logo-rifa">
      <h2>Reimprimir boleto</h2>
      <p>Busca un boleto comprado para abrir su comprobante de respaldo.</p>
    </header>

    <hr>

    <section class="formulario-rifa">
      <div class="fondo-imagen">
        <div class="fondo-vidrio">
          <label for="numero-boleto-reimpresion">N&uacute;mero de boleto</label>
          <input
            type="number"
            class="form-control"
            id="numero-boleto-reimpresion"
            inputmode="numeric"
            min="1"
            step="1"
            placeholder="Ej: 15"
          >

          <button class="btn btn-success btn-block mt-3" id="buscar-boleto-btn">
            Reimprimir boleto
          </button>

          <a href="./rifa.html" class="btn btn-light btn-block" id="volver-rifas-btn" role="button">
            Volver a rifas
          </a>

          <div class="alert mt-3 d-none" id="estado-reimpresion"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer mt-2 py-3 bg-dark text-white footer-redondo">
    <div class="container text-center">
      <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-2">
        <img src="assets/img/logo_transparente - copia.png" alt="Logo Benabet" width="28" height="28"
          class="mr-2 mb-2 mb-md-0">
        <a href="https://www.nairbdev.com" target="_blank" class="text-white">
          <span class="mx-2">Powered by: <strong>NairbDev</strong></span>
        </a>

        <span class="mx-2 text-muted">|</span>
        <span><i class="mr-1"></i> Dev by: <strong>Bryan Cruz</strong> V.V.2.2.0</span>
      </div>
    </div>
  </footer>

  <script type="module" src="assets/js/reimprimir.js"></script>
</body>

</html>
